[package]
name = "glacier"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"

http = "1.5.0"

hyper = { version = "1.11.1", features = [
    "server",
    "http1",
] }

hyper-util = { version = "0.1.20", features = [
    "tokio",
] }

http-body-util = "0.1.5"

tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "signal",
] }

tracing = "0.1.44"

tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
] }