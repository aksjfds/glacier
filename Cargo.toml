[package]
name = "glacier"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
futures-util = "0.3.34"

h2 = { version = "0.4.19", features = ["stream"] }
http = "1.5.0"

tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
] }

tokio-util = { version = "0.7.19", features = [
    "codec",
    "io",
    "rt",
] }

tower = { version = "0.5.3", features = [
    "util",
    "buffer",
    "limit",
    "load-shed",
    "timeout",
] }

tracing = "0.1.44"

tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
] }